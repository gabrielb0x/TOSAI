<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOSAI - API Playground</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');

      :root {
        color-scheme: dark;
        --bg-0: #050912;
        --bg-1: #0f172c;
        --line: rgba(151, 190, 255, 0.25);
        --text: #f2f6ff;
        --muted: #b7c7e8;
        --card: linear-gradient(160deg, rgba(15, 23, 44, 0.92), rgba(9, 14, 27, 0.88));
        --accent: #78e8ff;
        --accent-2: #8fd7ff;
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        font-weight: 600;
      }

      * {
        box-sizing: border-box;
        font-family: inherit;
        font-weight: inherit;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(circle at 80% -10%, rgba(70, 138, 255, 0.24), transparent 45%),
          radial-gradient(circle at 10% 120%, rgba(68, 235, 224, 0.2), transparent 48%),
          linear-gradient(140deg, var(--bg-0), var(--bg-1));
      }

      .shell {
        width: min(1020px, 100% - 2rem);
        margin: 0 auto;
        padding: 1.2rem 0 2rem;
      }

      header {
        border: 1px solid rgba(151, 190, 255, 0.2);
        background: rgba(8, 14, 28, 0.7);
        border-radius: 18px;
        padding: 1rem;
        margin-bottom: 0.9rem;
      }

      h1,
      h2,
      button {
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.65rem, 4.2vw, 2.7rem);
      }

      header p {
        margin: 0.55rem 0 0;
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 0.9rem;
      }

      section {
        border-radius: 16px;
        border: 1px solid rgba(151, 190, 255, 0.2);
        background: var(--card);
        padding: 1rem;
      }

      h2 {
        margin: 0 0 0.7rem;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      code {
        border-radius: 8px;
        border: 1px solid rgba(151, 190, 255, 0.2);
        background: rgba(6, 11, 22, 0.8);
        color: var(--text);
        padding: 0.17rem 0.36rem;
      }

      .row {
        margin-top: 0.8rem;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.6rem;
      }

      input {
        width: 100%;
        border-radius: 10px;
        border: 1px solid rgba(151, 190, 255, 0.3);
        background: rgba(9, 15, 29, 0.86);
        color: var(--text);
        padding: 0 0.8rem;
        height: 2.8rem;
      }

      button {
        border-radius: 10px;
        border: 1px solid rgba(171, 232, 255, 0.7);
        height: 2.8rem;
        min-width: 10rem;
        color: #05222f;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        cursor: pointer;
      }

      .log {
        margin-top: 0.7rem;
        border-radius: 10px;
        border: 1px solid rgba(151, 190, 255, 0.24);
        background: rgba(7, 12, 22, 0.9);
        color: #d8e7ff;
        padding: 0.82rem;
        font-size: 0.82rem;
        overflow: auto;
      }

      @media (max-width: 760px) {
        .shell {
          width: min(1020px, 100% - 1rem);
          padding-top: 0.7rem;
        }

        .row {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>TOSAI API Playground</h1>
        <p>Page de test rapide pour verifier les endpoints backend.</p>
      </header>

      <main class="grid">
        <section>
          <h2>Health check</h2>
          <p>GET <code>/healthz</code></p>
          <div class="row">
            <button id="healthz-btn">Check health</button>
          </div>
          <pre class="log" id="healthz-log">Ready.</pre>
        </section>

        <section>
          <h2>Summary endpoint</h2>
          <p>POST <code>/api/v1/summary</code> avec payload JSON.</p>
          <div class="row">
            <input id="summary-url" type="text" placeholder="https://example.com/terms" />
            <button id="summary-btn">Run analysis</button>
          </div>
          <pre class="log" id="summary-log">Waiting.</pre>
        </section>
      </main>
    </div>

    <script>
      const toJSON = async (response) => {
        const text = await response.text();
        try {
          return JSON.stringify(JSON.parse(text), null, 2);
        } catch (err) {
          return text || '<empty response>';
        }
      };

      document.getElementById('healthz-btn').addEventListener('click', async () => {
        const log = document.getElementById('healthz-log');
        log.textContent = 'Requesting...';
        try {
          const res = await fetch('/healthz');
          const body = await toJSON(res);
          log.textContent = `Status: ${res.status}\n${body}`;
        } catch (err) {
          log.textContent = `Request failed: ${err}`;
        }
      });

      document.getElementById('summary-btn').addEventListener('click', async () => {
        const log = document.getElementById('summary-log');
        const url = document.getElementById('summary-url').value.trim();

        if (!url) {
          log.textContent = 'Please provide an URL.';
          return;
        }

        log.textContent = 'Requesting...';

        try {
          const res = await fetch('/api/v1/summary', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ url }),
          });
          const body = await toJSON(res);
          log.textContent = `Status: ${res.status}\n${body}`;
        } catch (err) {
          log.textContent = `Request failed: ${err}`;
        }
      });
    </script>
  </body>
</html>
