<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-ToS API Smoke Test</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        line-height: 1.5;
        max-width: 960px;
      }
      header {
        margin-bottom: 1rem;
      }
      section {
        margin: 1rem 0;
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      code {
        background: rgba(128, 128, 128, 0.15);
        padding: 0.2rem 0.35rem;
        border-radius: 6px;
      }
      .log {
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: rgba(0, 0, 0, 0.05);
        padding: 0.75rem;
        border-radius: 8px;
        overflow: auto;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        padding: 0.5rem;
        border-radius: 6px;
        border: 1px solid #bbb;
        font-size: 1rem;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        border-radius: 6px;
        border: 1px solid #888;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Auto-ToS API Test Page</h1>
      <p>Use this page to verify the API is reachable without Docker.</p>
    </header>

    <section>
      <h2>Health check</h2>
      <p>GET <code>/healthz</code></p>
      <button id="healthz-btn">Check health</button>
      <pre class="log" id="healthz-log">Ready.</pre>
    </section>

    <section>
      <h2>Summary endpoint</h2>
      <p>GET <code>/api/v1/summary</code></p>
      <label for="summary-url">Optional URL parameter:</label>
      <input id="summary-url" type="text" placeholder="https://example.com/terms" />
      <button id="summary-btn">Call endpoint</button>
      <pre class="log" id="summary-log">Waiting.</pre>
    </section>

    <script>
      const toJSON = async (response) => {
        const text = await response.text();
        try {
          return JSON.stringify(JSON.parse(text), null, 2);
        } catch (err) {
          return text || "<empty response>";
        }
      };

      document.getElementById("healthz-btn").addEventListener("click", async () => {
        const log = document.getElementById("healthz-log");
        log.textContent = "Requesting...";
        try {
          const res = await fetch("/healthz");
          const body = await toJSON(res);
          log.textContent = `Status: ${res.status}\n${body}`;
        } catch (err) {
          log.textContent = `Request failed: ${err}`;
        }
      });

      document.getElementById("summary-btn").addEventListener("click", async () => {
        const log = document.getElementById("summary-log");
        const url = document.getElementById("summary-url").value.trim();
        const target = url ? `/api/v1/summary?url=${encodeURIComponent(url)}` : "/api/v1/summary";
        log.textContent = `Requesting ${target}...`;
        try {
          const res = await fetch(target);
          const body = await toJSON(res);
          log.textContent = `Status: ${res.status}\n${body}`;
        } catch (err) {
          log.textContent = `Request failed: ${err}`;
        }
      });
    </script>
  </body>
</html>
