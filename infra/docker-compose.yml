version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tosai_app
      POSTGRES_PASSWORD: tosai_app
      POSTGRES_DB: tosai
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_PORT: 9000
      APP_ENV: local
      DATABASE_URL: postgres://tosai_app:tosai_app@db:5432/tosai?sslmode=disable
      OPENAI_API_KEY: ""
      ADMIN_API_TOKEN: changeme
      CORS_ORIGINS: "*"
    ports:
      - "9000:9000"
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:9000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
