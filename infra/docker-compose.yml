version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autotos
      POSTGRES_PASSWORD: autotos
      POSTGRES_DB: autotos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://autotos:autotos@db:5432/autotos?sslmode=disable
      OPENAI_API_KEY: ""
      ADMIN_PASSWORD: changeme
      ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
